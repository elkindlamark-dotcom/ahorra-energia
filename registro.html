<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar un equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-3">
    <header class="p-4 mb-4 bg-primary text-white rounded">
        <h1>Registrar un equipo</h1>
        <p>Escriba los datos de un equipo de su casa.</p>
        <nav class="nav nav-pills flex-wrap">
            <a class="nav-link text-white" href="index.html">Inicio</a>
            <a class="nav-link text-white" href="equipos.html">Equipos de mi casa</a>
            <a class="nav-link active bg-white text-primary" aria-current="page" href="registro.html">Registrar un equipo</a>
            <a class="nav-link text-white" href="mi-factura.html">Mi factura</a>
            <a class="nav-link text-white" href="encuesta.html">Encuesta de hábitos</a>
        </nav>
    </header>

    <main>
        <form action="registro.html" method="get">

            <fieldset class="border rounded p-3 mb-3">
                <legend>Datos del equipo</legend>

                <p>
                    <label for="nombre">Nombre del equipo:</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" required placeholder="Ej.: Nevera">
                </p>

                <p>
                    <label for="potencia">Potencia (W):</label>
                    <input class="form-control" type="number" id="potencia" name="potencia" min="1" max="10000" required>
                </p>

                <p>
                    <label for="horas">Horas de uso al día:</label>
                    <input class="form-control" type="number" id="horas" name="horas" min="0" max="24" step="0.5" required>
                </p>

                <p>
                    <label for="tipo">Tipo de equipo:</label>
                    <select class="form-select" id="tipo" name="tipo">
                        <option value="calor">Produce calor (ducha, plancha, estufa)</option>
                        <option value="frio">Produce frío (nevera, aire acondicionado)</option>
                        <option value="electronico">Electrónico (televisor, computador)</option>
                        <option value="motor">Tiene motor (lavadora, licuadora)</option>
                    </select>
                </p>
            </fieldset>

            <fieldset class="border rounded p-3 mb-3">
                <legend>Uso</legend>
                <p>¿Cuándo lo usa más?</p>
                <input type="radio" id="dia" name="momento" value="dia" checked>
                <label for="dia">De día</label>
                <input type="radio" id="noche" name="momento" value="noche">
                <label for="noche">De noche (6 a 9 pm, la hora más cara)</label>

                <p>
                    <input type="checkbox" id="desconecta" name="desconecta" value="si">
                    <label for="desconecta">Lo desconecto cuando no lo uso</label>
                </p>

                <p>
                    <label for="fecha">Fecha del registro:</label>
                    <input class="form-control" type="date" id="fecha" name="fecha">
                </p>

                <p>
                    <label for="notas">Observaciones:</label><br>
                    <textarea class="form-control" id="notas" name="notas" rows="3" cols="40" placeholder="Ej.: la etiqueta está borrosa"></textarea>
                </p>
            </fieldset>

            <button class="btn btn-primary" type="submit">Registrar</button>
            <button class="btn btn-secondary" type="reset">Borrar</button>
        </form>
    </main>

    <footer class="mt-4 text-muted">
        <p>Autor: Elkin Rafael D&#x27;lamark Viana</p>
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
